[project]
name = "hx"
version = "0.1.0"
description = "Simple War agent harness CLI. See DESIGN.md."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1"]

[project.scripts]
hx = "hx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
