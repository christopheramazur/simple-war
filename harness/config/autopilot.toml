# hx autopilot: headless Claude Code works `bd ready` beads one at a time (harness/README.md, "Autopilot").
# Read before every bead, so edits apply without a restart. Raising any cap here needs the user's OK (AGENTS.md §6).

[claude]
model = "haiku"             # most beads: Haiku 5.5 at high effort (the plan's limits are shared with your own sessions)
effort = "high"             # claude --effort: low, medium, high, xhigh, max
permission_mode = "auto"    # auto mode: no prompts, risky actions still get reviewed; never bypassPermissions
max_turns = 120             # model turns per bead attempt
timeout_s = 7200            # wall clock per bead attempt; the work so far is kept as a WIP commit

# Large or long-horizon beads go to Opus 5.5 at medium effort, which plans and hands pieces to Haiku subagents.
# A bead is large when it carries one of `labels`, its description is at least `min_description_chars` long, or a
# Haiku attempt escalated it (`RESULT: escalate`, which does not use up an attempt) or ran into the timeout.
# model, effort, max_turns and timeout_s here override [claude] for those beads.
[claude.large]
model = "opus"
effort = "medium"
labels = ["large", "long-horizon"]
min_description_chars = 2000

# Plan limits (Claude Pro: a 5-hour window and a weekly window, shared with interactive use).
# Readings come from the status line of your own sessions and from every headless turn's rate-limit events.
[limits]
five_hour_start_pct = 60    # start a bead only below this share of the 5-hour window...
five_hour_stop_pct = 85     # ...and end a running one (keeping its work) above this, leaving room for you
weekly_max_pct = 90         # never take the weekly window past this
weekly_slack_pct = 50       # pace: by a point in the week, use at most weekly_max x the share of the week gone + this
reading_max_age_s = 900     # older than this: ask the API with a one-word haiku call before starting a bead

[beads]
max_attempts = 2            # a bead that fails this often is labelled autopilot-failed and left for a person
exclude_labels = ["needs-human", "swarm-harness", "autopilot-failed", "autopilot-blocked", "autopilot-partial"]
exclude_parents = ["sw-p2q"]  # the design-interview epic: those need the user
include_labels = ["u1"]     # focus: when set, only beads with one of these labels (owner, 2026-11-24: the U1 backlog)
idle_s = 900                # nothing to do: look again this much later

[merge]
test_timeout_s = 1800
