# USD per million tokens. Used for the API-equivalent spend estimate (DESIGN.md §2, Q4).
# Matched against the model id by longest `prefix`. Unmatched models get no estimate and
# show up as "unpriced" in `hx ingest`.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (fetched 2026-10-31).
# Global routing; US-only inference_geo would be 1.1x and is not modelled.
#
# Optional long-context tier: when prompt tokens (input + cache read + cache write) exceed
# `long_threshold`, the `long_*` prices apply to the whole call.

[[model]]
prefix = "claude-fable-5-1"
provider = "anthropic"
input = 10.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 0.25
output = 50.0

