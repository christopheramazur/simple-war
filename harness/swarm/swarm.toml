# Qwen swarm cadence and limits (read by hx swarm on every loop; edits apply without a restart where noted).
# The model is not configurable here on purpose: it is pinned in hx/swarm.py, opencode.json and the gateway.

[run]
end_at = "2026-11-24T13:00:00+00:00"   # 4 days from the start (2026-11-20 ~13:30 UTC)
# Nous gives the whole swarm ~50-95 Qwen calls an hour at 1-2 min each (2026-11-20), so turns are long and few.
# core = orchestrator + workers (the code pipeline); support = designers, researchers, deep research, retro.
# The auditor runs outside both. 4 agents at once got ~90% 429s before gateway pacing.
core_slots = 2
support_slots = 1
commit_every_s = 900                    # housekeeping: STATUS.md + commit docs/swarm
throttle_share_on = 0.4       # sw-0zi.2: pause support turns above this rate-limited share (last hour, swarm calls)
throttle_share_off = 0.25     # resume below this share...
throttle_min_ok_per_h = 30    # ...and with at least this many successful calls an hour (fewer also pauses)

[orchestrator]
pause_s = 240          # minimum gap after a turn (retro 2026-11-21: was 90; polling took 40% of all calls)
turn_timeout_s = 3600
heartbeat_s = 3600     # sw-0zi.3: turns start on new mail (worker finished, alert, answer); otherwise once per heartbeat

[workers]
max_parallel = 1
max_open = 4          # queued + running + finished-awaiting-merge
timeout_s = 7200
# sw-0zi.3: the supervisor's own pipeline steps (checked once a minute)
auto_refill = true                 # spawn the top ready bead when a slot was idle refill_idle_min minutes
refill_idle_min = 10               # the orchestrator gets the first pick after a worker finishes
refill_exclude_labels = ["needs-human", "swarm-harness", "no-swarm"]   # swarm-harness = guardrail work the swarm may not do; no-swarm = Opus-sized (U1)
refill_exclude_parents = ["sw-p2q"]                        # the deferred design-interview epic (needs the user)
review_timeout_min = 90            # a `done` worker unreviewed this long is merged through the gate and labelled swarm-unreviewed

[audit]
every_s = 1800
window_min = 30
turn_timeout_s = 2700  # retro 2026-11-21: was 1800; throttled audits were killed mid-run, producing "no verdict" WARNs
fail_streak = 2       # consecutive FAIL verdicts that stop the orchestrator (WARN never counts)
# sw-0zi.4: the verdict comes from rules every cycle; the model auditor only escalates
model_every_s = 14400       # the model writes its narrative report at least this often
model_min_gap_s = 3600      # and at most this often for actionable WARNs (a FAIL always calls it)
review_wait_min = 60        # a finished worker waiting longer than this is an actionable WARN
rate_limited_warn = 0.4     # health WARN (not mailed) above this share of rate-limited calls
loop_window_min = 120       # FAIL if the orchestrator ran loop_turns turns in this window with no effect
loop_turns = 4
max_postmortems_per_day = 3

[designers]
base = "designer"
roles = ["lead-designer", "ux-art-director", "tech-lead"]
every_s = 14400       # retro 2026-11-21: was 7200; halve support call demand while throttled — the brief queue is deep, the pipeline is merge-starved not design-starved
turn_timeout_s = 3600
initial_delay_s = 120

[researchers]
base = "researcher"
roles = ["games-researcher", "craft-researcher"]
every_s = 14400       # retro 2026-11-21: was 7200; same reason as designers
turn_timeout_s = 3600
initial_delay_s = 300

[research]
max_queued = 3
timeout_s = 3600

[retro]
every_s = 43200       # twice a day
turn_timeout_s = 3600

[merge]
test_timeout_s = 1500

[budgets]
# sw-0zi.5: model calls a turn of each kind may plan for. The time limit is calls x the current cost of a call
# (median latency of the last hour's successful swarm calls, scaled up by the rate-limited share) x slack,
# never below the role's configured time-out and never above cap_factor times it.
orchestrator = 20
worker = 40
designer = 20
researcher = 20
research = 25
retro = 20
auditor = 10
postmortem = 25
default = 20
slack = 1.3
cap_factor = 2.0
